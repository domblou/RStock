[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rstock"
version = "0.1.0"
description = "Python migration of the RStock market prediction workflow"
requires-python = ">=3.10"
dependencies = [
  "exchange-calendars>=4.11",
  "numpy>=1.26",
  "pandas>=2.1",
  "xgboost>=2.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["rstock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
